# The kit's own test suite. This workflow belongs to the kit repository and is
# never copied into a project; document-gate.yml is the one that is.
name: Kit tests

# Pull requests, and pushes to the default branch: a branch push that has a pull
# request would otherwise run the whole matrix twice.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python the kit claims to support, and the newest.
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.x" }
          # install.ps1, and the interpreter names a Windows machine offers.
          - { os: windows-latest, python: "3.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the tests
        run: python -m pytest tests -v
